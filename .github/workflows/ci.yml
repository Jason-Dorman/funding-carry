# CI gate per docs/testing-strategy.md: lint plus unit tests under the race
# detector, green on every push, and the integration suite against a real
# TimescaleDB — the schema is a contract, so it is tested rather than asserted.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # v9 is the first line of the action that supports golangci-lint v2, which
      # is the schema .golangci.yml is written against. The version is pinned to
      # the one used locally so CI and `make lint` cannot disagree about what
      # passes; bump both together.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # -count=1 matches `make test`: internal/guard depends on every package in
      # the module, which the test cache cannot represent.
      - name: Test
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest

    # The same image the Compose stack runs, so the migrations are exercised
    # against the TimescaleDB version they will actually meet.
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: carry
          POSTGRES_PASSWORD: carry
          POSTGRES_DB: carry
        # The same host port the Compose stack publishes, so `make
        # test-integration` needs no CI-specific configuration.
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U carry -d carry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Credentials match the synthetic ones in .env.example; the suite creates
      # its own throwaway database beside the one this points at.
      - name: Integration test
        run: make test-integration
