# golangci-lint v2 configuration. Run with `make lint`.
#
# The linter set enforces the project's engineering rules mechanically where it
# can: wrapped errors rather than log-and-continue, no unchecked returns, and a
# complexity ceiling matching docs/engineering-principles.md.
version: "2"

run:
  # The integration and live suites are code too — one asserts the schema
  # contract, the other the venue's payloads. Without this, their files are
  # invisible to the linter.
  build-tags:
    - integration
    - live

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose     # HTTP response bodies closed: leaks show up as stuck feeds
    - copyloopvar
    - errorlint     # errors compared with errors.Is/As, wrapped with %w
    - gocyclo
    - gosec
    - misspell
    - nilerr        # never return nil after checking a non-nil error
    - noctx         # no HTTP requests without a context: cancellation must flow
    - revive
    - unconvert
    - wastedassign

  settings:
    gocyclo:
      # docs/engineering-principles.md: under 10, 5 is the target.
      min-complexity: 10
    govet:
      enable-all: true
      disable:
        - fieldalignment  # readability of config structs beats packing bytes
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    generated: lax
    rules:
      # Test helpers legitimately do things production code should not, and a
      # test that walks a table of cases is a straight-line list of assertions
      # rather than the branching the complexity ceiling exists to catch.
      - path: _test\.go
        linters:
          - gocyclo
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Jason-Dorman/funding-carry
